# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-deepx"
BBFILE_PATTERN_meta-deepx = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-deepx = "6"

LAYERDEPENDS_meta-deepx = "core"
LAYERSERIES_COMPAT_meta-deepx = "kirkstone scarthgap"
